name: Collect flight data and deploy

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 min, off the busy top-of-hour slot; GitHub may still delay runs
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect positions (8 samples, 30 s apart)
        run: python scripts/collect.py --out site --samples 8 --interval 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages sometimes can't see the artifact that was just uploaded
      # ("No artifacts named github-pages were found"). It's a GitHub-side
      # timing glitch, so wait and try once more before failing the run.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
